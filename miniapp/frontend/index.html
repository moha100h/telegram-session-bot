<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>SMM Panel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0f0f13;--bg2:#1a1a24;--bg3:#22222f;--card:#1e1e2a;--border:#2e2e3e;
  --accent:#6c63ff;--accent2:#a78bfa;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;
  --blue:#3b82f6;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--r:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Vazirmatn',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
#app{max-width:480px;margin:0 auto;padding-bottom:80px}
.page{display:none}.page.active{display:block}

/* NAV */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:var(--bg2);border-top:1px solid var(--border);display:flex;z-index:100;
  padding:8px 0 max(8px,env(safe-area-inset-bottom))}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;
  border:none;background:none;color:var(--text3);cursor:pointer;font-family:inherit;font-size:10px;transition:.2s}
.nb.active{color:var(--accent2)}.nb svg{width:22px;height:22px}

/* HEADER */
.hdr{padding:20px 16px 12px;display:flex;align-items:center;justify-content:space-between}
.hdr h1{font-size:18px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-back{background:none;border:none;color:var(--text3);cursor:pointer;font-size:22px;padding:4px}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff}

/* BALANCE CARD */
.bal-card{background:linear-gradient(135deg,#1e1b4b,#312e81);border:1px solid #4338ca;
  border-radius:20px;padding:24px;margin:0 16px 16px;position:relative;overflow:hidden}
.bal-card::before{content:'';position:absolute;top:-40px;right:-40px;width:120px;height:120px;
  border-radius:50%;background:rgba(108,99,255,.15)}
.bal-lbl{font-size:13px;color:#a5b4fc;margin-bottom:6px}
.bal-amt{font-size:36px;font-weight:700;color:#fff;margin-bottom:4px}
.bal-sub{font-size:12px;color:#818cf8}

/* STATS GRID */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;margin-bottom:12px}
.sc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.sc-icon{font-size:22px;margin-bottom:6px}
.sc-val{font-size:20px;font-weight:700;margin-bottom:2px}
.sc-lbl{font-size:11px;color:var(--text3)}

/* LIST ITEM */
.li{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:14px 16px;margin:0 16px 8px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.15s}
.li:active{opacity:.7}
.li-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.li-icon.p{background:rgba(108,99,255,.15)}.li-icon.g{background:rgba(34,197,94,.15)}
.li-icon.b{background:rgba(59,130,246,.15)}.li-icon.y{background:rgba(245,158,11,.15)}
.li-icon.r{background:rgba(239,68,68,.15)}
.li-body{flex:1;min-width:0}
.li-title{font-size:14px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-sub{font-size:12px;color:var(--text3)}
.li-end{text-align:left;flex-shrink:0}
.li-price{font-size:14px;font-weight:700;color:var(--green)}
.li-date{font-size:11px;color:var(--text3);margin-top:2px}

/* BADGE */
.bdg{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.bdg.pending{background:rgba(245,158,11,.15);color:var(--yellow)}
.bdg.completed{background:rgba(34,197,94,.15);color:var(--green)}
.bdg.processing{background:rgba(59,130,246,.15);color:var(--blue)}
.bdg.rejected,.bdg.cancelled{background:rgba(239,68,68,.15);color:var(--red)}
.bdg.partial{background:rgba(168,139,250,.15);color:var(--accent2)}

/* TABS */
.tabs{display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:none;
  color:var(--text3);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;transition:.2s}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* SECTION TITLE */
.st{padding:4px 16px 10px;font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}

/* SEARCH */
.srch{padding:0 16px 12px}
.srch input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:10px 14px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.2s}
.srch input:focus{border-color:var(--accent)}

/* BUTTON */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;
  border-radius:10px;border:none;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.btn-p{background:var(--accent);color:#fff}.btn-p:active{opacity:.8}
.btn-d{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.btn-s{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3)}
.btn-b{background:rgba(59,130,246,.15);color:var(--blue);border:1px solid rgba(59,130,246,.3)}
.btn-y{background:rgba(245,158,11,.15);color:var(--yellow);border:1px solid rgba(245,158,11,.3)}
.btn-full{width:100%}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;
  align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:.25s}
.mo.open{opacity:1;pointer-events:all}
.mo-box{background:var(--bg2);border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:480px;
  transform:translateY(100%);transition:.3s cubic-bezier(.4,0,.2,1);max-height:85vh;overflow-y:auto}
.mo.open .mo-box{transform:translateY(0)}
.mo-title{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.mo-close{margin-right:auto;background:none;border:none;color:var(--text3);cursor:pointer;font-size:20px;padding:0}

/* INPUT */
.ig{margin-bottom:14px}
.ig label{font-size:12px;color:var(--text3);margin-bottom:6px;display:block}
.ig input,.ig textarea{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;
  padding:10px 14px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.2s}
.ig input:focus,.ig textarea:focus{border-color:var(--accent)}

/* SPINNER */
.sp{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.ldg{text-align:center;padding:40px 16px;color:var(--text3)}
.empty{text-align:center;padding:48px 16px;color:var(--text3)}
.empty-i{font-size:48px;margin-bottom:12px}

/* TOAST */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);
  background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 20px;
  font-size:14px;font-weight:500;z-index:999;transition:.3s;white-space:nowrap;box-shadow:0 4px 24px rgba(0,0,0,.4)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:var(--green);color:var(--green)}
.toast.err{border-color:var(--red);color:var(--red)}

/* ADMIN TAG */
.atag{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600}

/* DIVIDER */
.dv{height:1px;background:var(--border);margin:8px 16px}

/* CHEVRON */
.chv{color:var(--text3);transform:scaleX(-1)}
</style>
</head>
<body>
<div id="app">
  <div id="pg-home"   class="page active"></div>
  <div id="pg-orders" class="page"></div>
  <div id="pg-wallet" class="page"></div>
  <div id="pg-admin"  class="page"></div>
  <div id="pg-adm-users"  class="page"></div>
  <div id="pg-adm-orders" class="page"></div>
</div>

<nav class="nav" id="nav">
  <button class="nb active" onclick="go('home')" id="nb-home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>خانه
  </button>
  <button class="nb" onclick="go('orders')" id="nb-orders">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/></svg>سفارشات
  </button>
  <button class="nb" onclick="go('wallet')" id="nb-wallet">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>کیف پول
  </button>
  <button class="nb" id="nb-admin" style="display:none" onclick="go('admin')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>ادمین
  </button>
</nav>

<div class="mo" id="mo" onclick="closeMo()">
  <div class="mo-box" onclick="event.stopPropagation()"><div id="mo-body"></div></div>
</div>
<div class="toast" id="toast"></div>

<script>
const tg=window.Telegram.WebApp;
tg.ready();tg.expand();
tg.setHeaderColor('#0f0f13');tg.setBackgroundColor('#0f0f13');

let initData=tg.initData||'';
let isAdmin=false;
const ST={pending:'در صف',processing:'در حال انجام',completed:'تکمیل',
  partial:'ناقص',rejected:'رد شده',cancelled:'کنسل',failed:'ناموفق'};

async function api(path,opts={}){
  const r=await fetch('/api'+path,{...opts,headers:{'X-Init-Data':initData,'Content-Type':'application/json',...(opts.headers||{})}});
  if(!r.ok)throw new Error(await r.text());
  return r.json();
}

function toast(msg,type='ok'){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className=`toast ${type} show`;
  setTimeout(()=>el.classList.remove('show'),2500);
}

function openMo(html){document.getElementById('mo-body').innerHTML=html;document.getElementById('mo').classList.add('open');}
function closeMo(){document.getElementById('mo').classList.remove('open');}

function go(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
  const pg=document.getElementById('pg-'+page);
  if(pg){pg.classList.add('active');render(page);}
  const nb=document.getElementById('nb-'+page);
  if(nb)nb.classList.add('active');
}

function fmtD(d){return new Date(d).toLocaleDateString('fa-IR',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function fmtM(n){return '$'+parseFloat(n||0).toFixed(2);}
function bdg(s){return `<span class="bdg ${s}">${ST[s]||s}</span>`;}
function chv(){return `<svg class="chv" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>`;}
function spin(){return `<div class="ldg"><div class="sp"></div></div>`;}

// ── HOME ──────────────────────────────────────────────────────────────────────
async function render_home(el){
  el.innerHTML=spin();
  try{
    const u=await api('/user/me');
    const nm=[u.first_name,u.last_name].filter(Boolean).join(' ')||u.username||'کاربر';
    el.innerHTML=`
      <div class="hdr"><div><h1>SMM Panel</h1><div style="font-size:12px;color:var(--text3);margin-top:2px">خوش اومدی، ${nm} 👋</div></div>
        <div class="avatar">${nm.charAt(0).toUpperCase()}</div></div>
      <div class="bal-card">
        <div class="bal-lbl">موجودی حساب</div>
        <div class="bal-amt">${fmtM(u.balance)}</div>
        <div class="bal-sub">آیدی: ${u.telegram_id}</div>
      </div>
      <div class="sg">
        <div class="sc"><div class="sc-icon">📦</div><div class="sc-val" style="color:var(--accent2)" id="h-ord">—</div><div class="sc-lbl">سفارشات</div></div>
        <div class="sc"><div class="sc-icon">💳</div><div class="sc-val" style="color:var(--green)" id="h-tx">—</div><div class="sc-lbl">تراکنش‌ها</div></div>
      </div>
      <div class="st">دسترسی سریع</div>
      <div class="li" onclick="go('orders')"><div class="li-icon p">📦</div><div class="li-body"><div class="li-title">سفارشات من</div><div class="li-sub">مشاهده و پیگیری</div></div>${chv()}</div>
      <div class="li" onclick="go('wallet')"><div class="li-icon g">💰</div><div class="li-body"><div class="li-title">کیف پول</div><div class="li-sub">تراکنش‌ها</div></div>${chv()}</div>
    `;
    api('/user/orders?limit=1').then(r=>{const e=document.getElementById('h-ord');if(e)e.textContent=r.total;}).catch(()=>{});
    api('/user/transactions?limit=1').then(r=>{const e=document.getElementById('h-tx');if(e)e.textContent=r.total;}).catch(()=>{});
  }catch(e){el.innerHTML=`<div class="empty"><div class="empty-i">⚠️</div>خطا در بارگذاری</div>`;}
}

// ── ORDERS ────────────────────────────────────────────────────────────────────
let oFlt='all';
async function render_orders(el){
  el.innerHTML=`
    <div class="hdr"><h1>سفارشات</h1></div>
    <div class="tabs">
      ${['all:همه','pending:در صف','processing:در حال انجام','completed:تکمیل','rejected:رد شده'].map(x=>{
        const[v,l]=x.split(':');return`<button class="tab ${oFlt===v?'active':''}" onclick="setOFlt('${v}')">${l}</button>`;
      }).join('')}
    </div>
    <div id="ord-list">${spin()}</div>`;
  loadOrders();
}
function setOFlt(f){oFlt=f;render_orders(document.getElementById('pg-orders'));}
async function loadOrders(){
  const el=document.getElementById('ord-list');if(!el)return;
  try{
    const st=oFlt==='all'?'':('&status='+oFlt);
    const[smm,panel]=await Promise.all([api('/user/orders?limit=50'+st),api('/user/panel-orders?limit=50'+st)]);
    const all=[...smm.items.map(o=>({...o,_t:'smm'})),...panel.items.map(o=>({...o,_t:'panel'}))].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
    if(!all.length){el.innerHTML=`<div class="empty"><div class="empty-i">📭</div>سفارشی یافت نشد</div>`;return;}
    el.innerHTML=all.map(o=>`
      <div class="li">
        <div class="li-icon ${o._t==='smm'?'b':'p'}">${o._t==='smm'?'🌐':'🛒'}</div>
        <div class="li-body"><div class="li-title">${o.service_name||'سرویس'}</div><div class="li-sub">${bdg(o.status)} · ${o.quantity} عدد</div></div>
        <div class="li-end"><div class="li-price">${fmtM(o.sell_price||o.total_price)}</div><div class="li-date">${fmtD(o.created_at)}</div></div>
      </div>`).join('');
  }catch(e){el.innerHTML=`<div class="empty"><div class="empty-i">⚠️</div>خطا</div>`;}
}

// ── WALLET ────────────────────────────────────────────────────────────────────
async function render_wallet(el){
  el.innerHTML=`<div class="hdr"><h1>کیف پول</h1></div>${spin()}`;
  try{
    const[u,tx]=await Promise.all([api('/user/me'),api('/user/transactions?limit=50')]);
    const dep=tx.items.filter(t=>t.type==='deposit'&&t.status==='completed').reduce((s,t)=>s+t.amount,0);
    const spd=tx.items.filter(t=>t.type==='order_charge').reduce((s,t)=>s+Math.abs(t.amount),0);
    const icons={deposit:'💳',order_charge:'🛒',admin_charge:'🎁',refund:'↩️'};
    el.innerHTML=`
      <div class="hdr"><h1>کیف پول</h1></div>
      <div class="bal-card"><div class="bal-lbl">موجودی فعلی</div><div class="bal-amt">${fmtM(u.balance)}</div><div class="bal-sub">برای شارژ از بات استفاده کنید</div></div>
      <div class="sg">
        <div class="sc"><div class="sc-icon">⬇️</div><div class="sc-val" style="color:var(--green)">${fmtM(dep)}</div><div class="sc-lbl">کل واریز</div></div>
        <div class="sc"><div class="sc-icon">⬆️</div><div class="sc-val" style="color:var(--red)">${fmtM(spd)}</div><div class="sc-lbl">کل خرج</div></div>
      </div>
      <div class="st">تراکنش‌های اخیر</div>
      ${tx.items.length?tx.items.map(t=>{
        const isIn=t.amount>0;
        return`<div class="li">
          <div class="li-icon ${isIn?'g':'r'}">${icons[t.type]||'💰'}</div>
          <div class="li-body"><div class="li-title">${t.description||t.type}</div><div class="li-sub">${bdg(t.status)}</div></div>
          <div class="li-end"><div class="li-price" style="color:${isIn?'var(--green)':'var(--red)'}">${isIn?'+':''}${fmtM(t.amount)}</div><div class="li-date">${fmtD(t.created_at)}</div></div>
        </div>`;
      }).join(''):`<div class="empty"><div class="empty-i">💸</div>تراکنشی یافت نشد</div>`}`;
  }catch(e){el.innerHTML=`<div class="hdr"><h1>کیف پول</h1></div><div class="empty"><div class="empty-i">⚠️</div>خطا</div>`;}
}

// ── ADMIN DASHBOARD ───────────────────────────────────────────────────────────
async function render_admin(el){
  el.innerHTML=`<div class="hdr"><h1>داشبورد</h1><span class="atag">ADMIN</span></div>${spin()}`;
  try{
    const s=await api('/admin/stats');
    el.innerHTML=`
      <div class="hdr"><h1>داشبورد</h1><span class="atag">ADMIN</span></div>
      <div class="sg">
        <div class="sc"><div class="sc-icon">👥</div><div class="sc-val" style="color:var(--accent2)">${s.total_users}</div><div class="sc-lbl">کل کاربران</div></div>
        <div class="sc"><div class="sc-icon">🚫</div><div class="sc-val" style="color:var(--red)">${s.banned_users}</div><div class="sc-lbl">بن شده</div></div>
        <div class="sc"><div class="sc-icon">📦</div><div class="sc-val" style="color:var(--blue)">${s.total_orders+s.total_panel_orders}</div><div class="sc-lbl">کل سفارشات</div></div>
        <div class="sc"><div class="sc-icon">⏳</div><div class="sc-val" style="color:var(--yellow)">${s.pending_orders+s.pending_panel_orders}</div><div class="sc-lbl">در انتظار</div></div>
        <div class="sc"><div class="sc-icon">💰</div><div class="sc-val" style="color:var(--green)">${fmtM(s.total_revenue)}</div><div class="sc-lbl">درآمد کل</div></div>
        <div class="sc"><div class="sc-icon">📅</div><div class="sc-val" style="color:var(--accent2)">${fmtM(s.today_revenue)}</div><div class="sc-lbl">درآمد امروز</div></div>
      </div>
      <div class="st">مدیریت</div>
      <div class="li" onclick="go('adm-users')"><div class="li-icon p">👥</div><div class="li-body"><div class="li-title">مدیریت کاربران</div><div class="li-sub">جستجو · شارژ · بن/آنبن</div></div>${chv()}</div>
      <div class="li" onclick="go('adm-orders')"><div class="li-icon y">📋</div><div class="li-body"><div class="li-title">سفارشات پنل</div><div class="li-sub">تأیید · رد · تغییر وضعیت</div></div>${chv()}</div>
    `;
  }catch(e){el.innerHTML=`<div class="hdr"><h1>داشبورد</h1></div><div class="empty"><div class="empty-i">⚠️</div>خطا</div>`;}
}

// ── ADMIN USERS ───────────────────────────────────────────────────────────────
let uSrch='',uTimer=null;
async function render_adm_users(el){
  el.innerHTML=`
    <div class="hdr"><button class="hdr-back" onclick="go('admin')">←</button><h1>کاربران</h1><div></div></div>
    <div class="srch"><input placeholder="🔍 نام، یوزرنیم، آیدی..." value="${uSrch}" oninput="uSrch=this.value;clearTimeout(uTimer);uTimer=setTimeout(loadAU,400)"/></div>
    <div id="au-list">${spin()}</div>`;
  loadAU();
}
async function loadAU(){
  const el=document.getElementById('au-list');if(!el)return;
  try{
    const q=uSrch?('&search='+encodeURIComponent(uSrch)):'';
    const d=await api('/admin/users?limit=30'+q);
    if(!d.items.length){el.innerHTML=`<div class="empty"><div class="empty-i">👤</div>کاربری یافت نشد</div>`;return;}
    el.innerHTML=d.items.map(u=>{
      const nm=[u.first_name,u.last_name].filter(Boolean).join(' ')||u.username||`User${u.telegram_id}`;
      const enc=encodeURIComponent(JSON.stringify(u));
      return`<div class="li" onclick="showU(decodeURIComponent('${enc}'))">
        <div class="li-icon ${u.is_banned?'r':'p'}">${u.is_banned?'🚫':'👤'}</div>
        <div class="li-body"><div class="li-title">${nm}${u.is_banned?' <span style="color:var(--red);font-size:11px">بن</span>':''}</div><div class="li-sub">@${u.username||'—'} · ${u.telegram_id}</div></div>
        <div class="li-end"><div class="li-price">${fmtM(u.balance)}</div><div class="li-date">${fmtD(u.created_at)}</div></div>
      </div>`;
    }).join('');
  }catch(e){el.innerHTML=`<div class="empty"><div class="empty-i">⚠️</div>خطا</div>`;}
}
function showU(json){
  const u=JSON.parse(json);
  const nm=[u.first_name,u.last_name].filter(Boolean).join(' ')||u.username||`User${u.telegram_id}`;
  openMo(`
    <div class="mo-title">👤 ${nm}<button class="mo-close" onclick="closeMo()">✕</button></div>
    <div style="color:var(--text3);font-size:13px;margin-bottom:16px;line-height:2">
      آیدی: <b style="color:var(--text)">${u.telegram_id}</b><br>
      موجودی: <b style="color:var(--green)">${fmtM(u.balance)}</b><br>
      وضعیت: ${u.is_banned?'<span style="color:var(--red)">بن شده</span>':'<span style="color:var(--green)">فعال</span>'}
    </div>
    <div class="ig"><label>شارژ موجودی ($)</label><input type="number" id="ca" placeholder="مثلاً 5.00" step="0.01" min="0.01"/></div>
    <div class="ig"><label>توضیح (اختیاری)</label><input id="cn" placeholder="دلیل شارژ..."/></div>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="btn btn-s btn-full" onclick="chargeU(${u.id})">💰 شارژ</button>
      <button class="btn ${u.is_banned?'btn-s':'btn-d'} btn-full" onclick="toggleBan(${u.id},${u.is_banned})">${u.is_banned?'✅ آنبن':'🚫 بن'}</button>
    </div>`);
}
async function chargeU(id){
  const amt=parseFloat(document.getElementById('ca').value);
  const note=document.getElementById('cn').value;
  if(!amt||amt<=0){toast('مبلغ معتبر وارد کنید','err');return;}
  try{await api('/admin/users/'+id+'/charge',{method:'POST',body:JSON.stringify({amount:amt,note})});toast('✅ شارژ انجام شد');closeMo();loadAU();}
  catch(e){toast('خطا در شارژ','err');}
}
async function toggleBan(id,banned){
  try{await api('/admin/users/'+id+'/'+(banned?'unban':'ban'),{method:'POST'});toast(banned?'✅ آنبن شد':'🚫 بن شد');closeMo();loadAU();}
  catch(e){toast('خطا','err');}
}

// ── ADMIN ORDERS ──────────────────────────────────────────────────────────────
let aoFlt='pending';
async function render_adm_orders(el){
  el.innerHTML=`
    <div class="hdr"><button class="hdr-back" onclick="go('admin')">←</button><h1>سفارشات پنل</h1><div></div></div>
    <div class="tabs">
      ${['pending:در انتظار','processing:در حال انجام','completed:تکمیل','all:همه'].map(x=>{
        const[v,l]=x.split(':');return`<button class="tab ${aoFlt===v?'active':''}" onclick="setAOFlt('${v}')">${l}</button>`;
      }).join('')}
    </div>
    <div id="ao-list">${spin()}</div>`;
  loadAO();
}
function setAOFlt(f){aoFlt=f;render_adm_orders(document.getElementById('pg-adm-orders'));}
async function loadAO(){
  const el=document.getElementById('ao-list');if(!el)return;
  try{
    const st=aoFlt==='all'?'':('&status='+aoFlt);
    const d=await api('/admin/panel-orders?limit=50'+st);
    if(!d.items.length){el.innerHTML=`<div class="empty"><div class="empty-i">📭</div>سفارشی یافت نشد</div>`;return;}
    el.innerHTML=d.items.map(o=>{
      const enc=encodeURIComponent(JSON.stringify(o));
      return`<div class="li" onclick="showO(decodeURIComponent('${enc}'))">
        <div class="li-icon y">🛒</div>
        <div class="li-body"><div class="li-title">${o.service_name||'سرویس'}</div><div class="li-sub">${bdg(o.status)} · ${o.panel_name||'پنل'} · ${o.quantity} عدد</div></div>
        <div class="li-end"><div class="li-price">${fmtM(o.total_price)}</div><div class="li-date">${fmtD(o.created_at)}</div></div>
      </div>`;
    }).join('');
  }catch(e){el.innerHTML=`<div class="empty"><div class="empty-i">⚠️</div>خطا</div>`;}
}
function showO(json){
  const o=JSON.parse(json);
  openMo(`
    <div class="mo-title">🛒 سفارش #${o.id}<button class="mo-close" onclick="closeMo()">✕</button></div>
    <div style="font-size:13px;color:var(--text3);margin-bottom:16px;line-height:2">
      سرویس: <b style="color:var(--text)">${o.service_name||'—'}</b><br>
      پنل: <b style="color:var(--text)">${o.panel_name||'—'}</b><br>
      تعداد: <b style="color:var(--text)">${o.quantity}</b> · مبلغ: <b style="color:var(--green)">${fmtM(o.total_price)}</b><br>
      ${o.link?`لینک: <b style="color:var(--accent2);word-break:break-all">${o.link}</b><br>`:''}
      وضعیت: ${bdg(o.status)}
    </div>
    <div class="ig"><label>یادداشت ادمین</label><input id="on" value="${o.admin_note||''}" placeholder="یادداشت..."/></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <button class="btn btn-s" onclick="updO(${o.id},'completed')">✅ تکمیل</button>
      <button class="btn btn-d" onclick="updO(${o.id},'rejected')">❌ رد</button>
      <button class="btn btn-b" onclick="updO(${o.id},'processing')">🔄 در حال انجام</button>
      <button class="btn btn-y" onclick="updO(${o.id},'pending')">⏳ برگشت به صف</button>
    </div>`);
}
async function updO(id,status){
  const note=document.getElementById('on')?.value||'';
  try{await api('/admin/panel-orders/'+id,{method:'PATCH',body:JSON.stringify({status,admin_note:note})});toast('✅ بروز شد');closeMo();loadAO();}
  catch(e){toast('خطا','err');}
}

// ── RENDER ROUTER ─────────────────────────────────────────────────────────────
function render(page){
  const el=document.getElementById('pg-'+page);if(!el)return;
  const fn={'home':render_home,'orders':render_orders,'wallet':render_wallet,
    'admin':render_admin,'adm-users':render_adm_users,'adm-orders':render_adm_orders};
  if(fn[page])fn[page](el);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init(){
  try{
    await api('/admin/stats');
    isAdmin=true;
    document.getElementById('nb-admin').style.display='flex';
  }catch(e){isAdmin=false;}
  go('home');
}
init();
</script>
