<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>SMM Panel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0f0f13;--bg2:#1a1a24;--bg3:#22222f;--card:#1e1e2a;--border:#2e2e3e;
  --accent:#6c63ff;--accent2:#a78bfa;--green:#22c55e;--red:#ef4444;
  --yellow:#f59e0b;--blue:#3b82f6;--orange:#f97316;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Vazirmatn',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
#app{max-width:480px;margin:0 auto;padding-bottom:80px}
.page{display:none}.page.active{display:block}

/* NAV */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:var(--bg2);border-top:1px solid var(--border);display:flex;z-index:100;
  padding:8px 0 max(8px,env(safe-area-inset-bottom))}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;
  border:none;background:none;color:var(--text3);cursor:pointer;font-family:inherit;font-size:10px;transition:.2s}
.nb.active{color:var(--accent2)}.nb svg{width:22px;height:22px}

/* HEADER */
.hdr{padding:16px 16px 10px;display:flex;align-items:center;gap:10px}
.hdr h1{font-size:17px;font-weight:700;flex:1}
.hdr-back{background:none;border:none;color:var(--text3);cursor:pointer;font-size:20px;padding:4px;line-height:1}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0}

/* BALANCE CARD */
.bal-card{background:linear-gradient(135deg,#1e1b4b,#312e81);border:1px solid #4338ca;
  border-radius:20px;padding:20px;margin:0 16px 14px;position:relative;overflow:hidden}
.bal-card::before{content:'';position:absolute;top:-30px;right:-30px;width:100px;height:100px;
  border-radius:50%;background:rgba(108,99,255,.2)}
.bal-lbl{font-size:12px;color:#a5b4fc;margin-bottom:4px}
.bal-amt{font-size:32px;font-weight:700;color:#fff;margin-bottom:2px}
.bal-sub{font-size:11px;color:#818cf8}

/* STATS GRID */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px;margin-bottom:12px}
.sc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px}
.sc-icon{font-size:20px;margin-bottom:4px}
.sc-val{font-size:18px;font-weight:700;margin-bottom:2px}
.sc-lbl{font-size:11px;color:var(--text3)}

/* LIST ITEM */
.li{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:12px 14px;margin:0 16px 8px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:.15s}
.li:active{opacity:.7;transform:scale(.99)}
.li-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.li-icon.p{background:rgba(108,99,255,.15)}.li-icon.g{background:rgba(34,197,94,.15)}
.li-icon.b{background:rgba(59,130,246,.15)}.li-icon.y{background:rgba(245,158,11,.15)}
.li-icon.r{background:rgba(239,68,68,.15)}.li-icon.o{background:rgba(249,115,22,.15)}
.li-body{flex:1;min-width:0}
.li-title{font-size:13px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-sub{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.li-end{text-align:left;flex-shrink:0}
.li-price{font-size:13px;font-weight:700;color:var(--green)}
.li-date{font-size:10px;color:var(--text3);margin-top:2px}

/* BADGE */
.bdg{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap}
.bdg.pending{background:rgba(245,158,11,.15);color:var(--yellow)}
.bdg.completed{background:rgba(34,197,94,.15);color:var(--green)}
.bdg.processing{background:rgba(59,130,246,.15);color:var(--blue)}
.bdg.rejected,.bdg.cancelled{background:rgba(239,68,68,.15);color:var(--red)}
.bdg.partial{background:rgba(249,115,22,.15);color:var(--orange)}
.bdg.failed{background:rgba(239,68,68,.1);color:var(--red)}

/* TABS */
.tabs{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:none;
  color:var(--text3);font-family:inherit;font-size:11px;font-weight:500;cursor:pointer;white-space:nowrap;transition:.2s}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* SECTION TITLE */
.st{padding:4px 16px 8px;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px}

/* SEARCH */
.srch{padding:0 16px 10px}
.srch input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:9px 12px;color:var(--text);font-family:inherit;font-size:13px;outline:none;transition:.2s}
.srch input:focus{border-color:var(--accent)}

/* BUTTON */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;
  border-radius:10px;border:none;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
.btn:active{opacity:.8;transform:scale(.98)}
.btn-p{background:var(--accent);color:#fff}
.btn-d{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.btn-s{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3)}
.btn-b{background:rgba(59,130,246,.15);color:var(--blue);border:1px solid rgba(59,130,246,.3)}
.btn-y{background:rgba(245,158,11,.15);color:var(--yellow);border:1px solid rgba(245,158,11,.3)}
.btn-o{background:rgba(249,115,22,.15);color:var(--orange);border:1px solid rgba(249,115,22,.3)}
.btn-full{width:100%}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;
  align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:.25s}
.mo.open{opacity:1;pointer-events:all}
.mo-box{background:var(--bg2);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:480px;
  transform:translateY(100%);transition:.3s cubic-bezier(.4,0,.2,1);max-height:88vh;overflow-y:auto}
.mo.open .mo-box{transform:translateY(0)}
.mo-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.mo-close{margin-right:auto;background:none;border:none;color:var(--text3);cursor:pointer;font-size:20px;padding:0;line-height:1}

/* INPUT */
.ig{margin-bottom:12px}
.ig label{font-size:11px;color:var(--text3);margin-bottom:5px;display:block;font-weight:500}
.ig input,.ig textarea,.ig select{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;
  padding:9px 12px;color:var(--text);font-family:inherit;font-size:13px;outline:none;transition:.2s;resize:none}
.ig input:focus,.ig textarea:focus,.ig select:focus{border-color:var(--accent)}
.ig select option{background:var(--bg3)}

/* SPINNER */
.sp{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite;margin:32px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.ldg{text-align:center;padding:32px 16px;color:var(--text3)}
.empty{text-align:center;padding:40px 16px;color:var(--text3)}
.empty-i{font-size:44px;margin-bottom:10px}
.empty-t{font-size:13px}

/* TOAST */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);
  background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px 18px;
  font-size:13px;font-weight:500;z-index:999;transition:.3s;white-space:nowrap;box-shadow:0 4px 24px rgba(0,0,0,.5)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:var(--green);color:var(--green)}
.toast.err{border-color:var(--red);color:var(--red)}
.toast.info{border-color:var(--blue);color:var(--blue)}

/* ADMIN TAG */
.atag{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
  font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600}

/* DIVIDER */
.dv{height:1px;background:var(--border);margin:6px 16px}

/* PANEL CARD */
.panel-card{background:linear-gradient(135deg,var(--card),var(--bg3));border:1px solid var(--border);
  border-radius:16px;padding:16px;margin:0 16px 10px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.panel-card:active{opacity:.8;transform:scale(.99)}
.panel-card::before{content:'';position:absolute;top:-20px;left:-20px;width:80px;height:80px;
  border-radius:50%;background:rgba(108,99,255,.08)}
.panel-card-title{font-size:15px;font-weight:700;margin-bottom:4px}
.panel-card-desc{font-size:12px;color:var(--text3)}
.panel-card-arrow{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:18px}

/* SERVICE CARD */
.svc-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:14px;margin:0 16px 8px;cursor:pointer;transition:.15s}
.svc-card:active{opacity:.7}
.svc-card-name{font-size:13px;font-weight:600;margin-bottom:6px}
.svc-card-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text3)}
.svc-card-price{font-size:14px;font-weight:700;color:var(--accent2)}

/* ORDER DETAIL */
.od-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.od-row:last-child{border-bottom:none}
.od-lbl{color:var(--text3)}
.od-val{font-weight:600;text-align:left;max-width:60%;word-break:break-all}

/* REFUND BADGE */
.refund-badge{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:10px;
  padding:8px 12px;font-size:12px;color:var(--green);margin-top:8px;text-align:center}

/* PROGRESS BAR */
.prog-wrap{background:var(--bg3);border-radius:20px;height:6px;margin-top:6px;overflow:hidden}
.prog-bar{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:.5s}

/* GRID 2 */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
</style>
</head>
<body>
<div id="app">
  <div id="pg-home"        class="page active"></div>
  <div id="pg-panels"      class="page"></div>
  <div id="pg-panel-cats"  class="page"></div>
  <div id="pg-panel-svcs"  class="page"></div>
  <div id="pg-orders"      class="page"></div>
  <div id="pg-wallet"      class="page"></div>
  <div id="pg-admin"       class="page"></div>
  <div id="pg-adm-users"   class="page"></div>
  <div id="pg-adm-orders"  class="page"></div>
</div>

<nav class="nav" id="nav">
  <button class="nb active" onclick="go('home')" id="nb-home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>خانه
  </button>
  <button class="nb" onclick="go('panels')" id="nb-panels">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>پنل‌ها
  </button>
  <button class="nb" onclick="go('orders')" id="nb-orders">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/></svg>سفارشات
  </button>
  <button class="nb" onclick="go('wallet')" id="nb-wallet">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>کیف پول
  </button>
  <button class="nb" id="nb-admin" style="display:none" onclick="go('admin')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>ادمین
  </button>
</nav>

<div class="mo" id="mo" onclick="closeMo()">
  <div class="mo-box" onclick="event.stopPropagation()"><div id="mo-body"></div></div>
</div>
<div class="toast" id="toast"></div>

<script>
const tg=window.Telegram.WebApp;
tg.ready();tg.expand();
tg.setHeaderColor('#0f0f13');tg.setBackgroundColor('#0f0f13');
let initData=tg.initData||'';
let isAdmin=false;
let _curUser=null;

// ── STATE ─────────────────────────────────────────────────────────────────────
let _state={
  panelId:null, panelName:'', panelDesc:'',
  catId:null, catName:'',
  svcId:null, svcName:'', svcPrice:0, svcMin:1, svcMax:10000,
  orderLink:'', orderQty:0, orderNote:'',
  orderStep:0  // 0=idle 1=link 2=qty 3=note 4=confirm
};

// ── STATUS ────────────────────────────────────────────────────────────────────
const ST_FA={pending:'در صف',processing:'در حال انجام',completed:'تکمیل شد',
  partial:'تکمیل جزئی',rejected:'رد شد',cancelled:'کنسل',failed:'ناموفق'};
const ST_IC={pending:'⏳',processing:'🔄',completed:'✅',partial:'⚠️',rejected:'❌',cancelled:'🚫',failed:'💔'};
const TX_FA={deposit:'واریز',order_charge:'پرداخت سفارش',admin_charge:'شارژ ادمین',
  refund:'بازگشت وجه',panel_order_charge:'پرداخت پنل'};

// ── API ───────────────────────────────────────────────────────────────────────
async function api(path,opts={}){
  const r=await fetch('/api'+path,{...opts,
    headers:{'X-Init-Data':initData,'Content-Type':'application/json',...(opts.headers||{})}});
  if(!r.ok){const t=await r.text();throw new Error(t);}
  return r.json();
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function toast(msg,type='ok'){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className=`toast ${type} show`;
  setTimeout(()=>el.classList.remove('show'),2800);
}
function openMo(html){
  document.getElementById('mo-body').innerHTML=html;
  document.getElementById('mo').classList.add('open');
}
function closeMo(){document.getElementById('mo').classList.remove('open');}
function fmtD(d){
  if(!d)return'—';
  return new Date(d).toLocaleDateString('fa-IR',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
}
function fmtM(n){return'$'+parseFloat(n||0).toFixed(2);}
function fmtM4(n){return'$'+parseFloat(n||0).toFixed(4);}
function bdg(s){return`<span class="bdg ${s}">${ST_IC[s]||''} ${ST_FA[s]||s}</span>`;}
function spin(){return`<div class="ldg"><div class="sp"></div></div>`;}
function empty(icon,txt){return`<div class="empty"><div class="empty-i">${icon}</div><div class="empty-t">${txt}</div></div>`;}

// ── NAVIGATE ──────────────────────────────────────────────────────────────────
const _history=[];
function go(page,push=true){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
  const pg=document.getElementById('pg-'+page);
  if(!pg)return;
  pg.classList.add('active');
  const nb=document.getElementById('nb-'+page);
  if(nb)nb.classList.add('active');
  if(push)_history.push(page);
  render(page);
}
function goBack(){
  if(_history.length>1){_history.pop();go(_history[_history.length-1],false);}
  else go('home',false);
}
tg.BackButton.onClick(()=>goBack());

function render(page){
  const el=document.getElementById('pg-'+page);if(!el)return;
  const fn={
    'home':renderHome,'panels':renderPanels,'panel-cats':renderPanelCats,
    'panel-svcs':renderPanelSvcs,'orders':renderOrders,'wallet':renderWallet,
    'admin':renderAdmin,'adm-users':renderAdmUsers,'adm-orders':renderAdmOrders
  };
  if(fn[page])fn[page](el);
}

// ══════════════════════════════════════════════════════════════════════════════
// HOME
// ══════════════════════════════════════════════════════════════════════════════
async function renderHome(el){
  el.innerHTML=spin();
  try{
    const u=await api('/user/me');
    _curUser=u;
    const nm=[u.first_name,u.last_name].filter(Boolean).join(' ')||u.username||'کاربر';
    el.innerHTML=`
      <div class="hdr">
        <div style="flex:1">
          <div style="font-size:16px;font-weight:700">سلام ${nm} 👋</div>
          <div style="font-size:11px;color:var(--text3);margin-top:2px">خوش اومدی به پنل</div>
        </div>
        <div class="avatar">${nm.charAt(0).toUpperCase()}</div>
      </div>
      <div class="bal-card">
        <div class="bal-lbl">موجودی حساب</div>
        <div class="bal-amt">${fmtM(u.balance)}</div>
        <div class="bal-sub">آیدی: ${u.telegram_id}${u.username?' · @'+u.username:''}</div>
      </div>
      <div class="sg">
        <div class="sc"><div class="sc-icon">📦</div><div class="sc-val" style="color:var(--accent2)" id="h-ord">—</div><div class="sc-lbl">کل سفارشات</div></div>
        <div class="sc"><div class="sc-icon">⏳</div><div class="sc-val" style="color:var(--yellow)" id="h-pend">—</div><div class="sc-lbl">در انتظار</div></div>
        <div class="sc"><div class="sc-icon">✅</div><div class="sc-val" style="color:var(--green)" id="h-done">—</div><div class="sc-lbl">تکمیل شده</div></div>
        <div class="sc"><div class="sc-icon">💳</div><div class="sc-val" style="color:var(--blue)" id="h-tx">—</div><div class="sc-lbl">تراکنش‌ها</div></div>
      </div>
      <div class="st">دسترسی سریع</div>
      <div class="li" onclick="go('panels')">
        <div class="li-icon p">🛒</div>
        <div class="li-body"><div class="li-title">ثبت سفارش جدید</div><div class="li-sub">مشاهده پنل‌ها و خدمات</div></div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="color:var(--text3);transform:scaleX(-1)"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="li" onclick="go('orders')">
        <div class="li-icon b">📋</div>
        <div class="li-body"><div class="li-title">سفارشات من</div><div class="li-sub">پیگیری وضعیت سفارشات</div></div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="color:var(--text3);transform:scaleX(-1)"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="li" onclick="go('wallet')">
        <div class="li-icon g">💰</div>
        <div class="li-body"><div class="li-title">کیف پول</div><div class="li-sub">موجودی و تراکنش‌ها</div></div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="color:var(--text3);transform:scaleX(-1)"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
    `;
    // load stats
    api('/user/panel-orders?limit=1').then(r=>{
      const e1=document.getElementById('h-ord');
      const e2=document.getElementById('h-pend');
      if(e1)e1.textContent=r.total;
      if(e2){
        api('/user/panel-orders?limit=1&status=pending').then(r2=>{
          if(e2)e2.textContent=r2.total;
        }).catch(()=>{});
      }
    }).catch(()=>{});
    api('/user/panel-orders?limit=1&status=completed').then(r=>{
      const e=document.getElementById('h-done');if(e)e.textContent=r.total;
    }).catch(()=>{});
    api('/user/transactions?limit=1').then(r=>{
      const e=document.getElementById('h-tx');if(e)e.textContent=r.total;
    }).catch(()=>{});
  }catch(e){el.innerHTML=empty('⚠️','خطا در بارگذاری');}
}

// ══════════════════════════════════════════════════════════════════════════════
// PANELS — لیست پنل‌ها
// ══════════════════════════════════════════════════════════════════════════════
async function renderPanels(el){
  el.innerHTML=`<div class="hdr"><h1>پنل‌ها</h1></div>${spin()}`;
  try{
    const panels=await api('/user/panels');

function openPanel(id,name,desc){

}

function openSvcDetail(svcJson){

    <div class="od-row"><span class="od-lbl">📊 حداقل سفارش</span><span class="od-val">${s.min_qty.toLocaleString('fa')}</span></div>
    <div class="od-row"><span class="od-lbl">📊 حداکثر سفارش</span><span class="od-val">${s.max_qty.toLocaleString('fa')}</span></div>

// ══════════════════════════════════════════════════════════════════════════════
// ORDER FLOW — فرم سفارش
// ══════════════════════════════════════════════════════════════════════════════
function startOrder(){
  _state.orderStep=1;_state.orderLink='';_state.orderQty=0;_state.orderNote='';
  showOrderStep();
}

function showOrderStep(){
  const s=_state;
  if(s.orderStep===1){
    openMo(`
      <div class="mo-title">🔗 لینک مقصد<button class="mo-close" onclick="closeMo()">✕</button></div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:12px">
        سرویس: <b style="color:var(--text)">${esc(s.svcName)}</b>
      </div>
      <div class="ig">
        <label>لینک یا یوزرنیم مقصد</label>
        <input id="ord-link" placeholder="https://t.me/channel یا @username" value="${esc(s.orderLink)}"/>
      </div>
      <div class="g2">
        <button class="btn btn-d" onclick="closeMo()">❌ لغو</button>
        <button class="btn btn-p" onclick="submitLink()">بعدی ←</button>
      </div>
    `);
    setTimeout(()=>document.getElementById('ord-link')?.focus(),300);
  }
  else if(s.orderStep===2){
    const minCost=fmtM4(s.svcPrice*s.svcMin);
    const maxCost=fmtM4(s.svcPrice*s.svcMax);
    openMo(`
      <div class="mo-title">🔢 تعداد<button class="mo-close" onclick="closeMo()">✕</button></div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:12px">
        لینک: <code style="color:var(--accent2);font-size:11px">${esc(s.orderLink.substring(0,40))}</code>
      </div>
      <div class="ig">
        <label>تعداد (${s.svcMin.toLocaleString('fa')} تا ${s.svcMax.toLocaleString('fa')})</label>
        <input id="ord-qty" type="number" placeholder="${s.svcMin}" min="${s.svcMin}" max="${s.svcMax}" value="${s.orderQty||''}"/>
      </div>
      <div style="font-size:11px;color:var(--text3);margin-bottom:12px">
        💰 هزینه تقریبی: <span id="cost-preview" style="color:var(--accent2);font-weight:600">${s.orderQty?fmtM4(s.svcPrice*s.orderQty):minCost+' ~ '+maxCost}</span>
      </div>
      <div class="g2">
        <button class="btn btn-d" onclick="_state.orderStep=1;showOrderStep()">← قبلی</button>
        <button class="btn btn-p" onclick="submitQty()">بعدی ←</button>
      </div>
    `);
    const qi=document.getElementById('ord-qty');
    if(qi){
      qi.addEventListener('input',()=>{
        const v=parseInt(qi.value)||0;
        const cp=document.getElementById('cost-preview');
        if(cp&&v>=s.svcMin&&v<=s.svcMax)cp.textContent=fmtM4(s.svcPrice*v);
      });
      setTimeout(()=>qi.focus(),300);
    }
  }
  else if(s.orderStep===3){
    openMo(`
      <div class="mo-title">📝 توضیح (اختیاری)<button class="mo-close" onclick="closeMo()">✕</button></div>
      <div class="ig">
        <label>توضیح اضافه</label>
        <textarea id="ord-note" rows="3" placeholder="اختیاری — اگه نداری خالی بذار">${esc(s.orderNote)}</textarea>
      </div>
      <div class="g2">
        <button class="btn btn-d" onclick="_state.orderStep=2;showOrderStep()">← قبلی</button>
        <button class="btn btn-p" onclick="submitNote()">بعدی ←</button>
      </div>
    `);
  }
  else if(s.orderStep===4){
    const total=s.svcPrice*s.orderQty;
    const bal=_curUser?parseFloat(_curUser.balance||0):0;
    const ok=bal>=total-1e-9;
    openMo(`
      <div class="mo-title">✅ تایید سفارش<button class="mo-close" onclick="closeMo()">✕</button></div>
      <div class="od-row"><span class="od-lbl">📌 خدمت</span><span class="od-val">${esc(s.svcName)}</span></div>
      <div class="od-row"><span class="od-lbl">🔗 لینک</span><span class="od-val" style="color:var(--accent2);font-size:11px">${esc(s.orderLink)}</span></div>
      <div class="od-row"><span class="od-lbl">🔢 تعداد</span><span class="od-val">${s.orderQty.toLocaleString('fa')}</span></div>
      ${s.orderNote?`<div class="od-row"><span class="od-lbl">📝 توضیح</span><span class="od-val">${esc(s.orderNote)}</span></div>`:''}
      <div class="od-row"><span class="od-lbl">💰 هزینه کل</span><span class="od-val" style="color:var(--accent2);font-size:15px;font-weight:700">${fmtM4(total)}</span></div>
      <div class="od-row"><span class="od-lbl">💳 موجودی</span><span class="od-val" style="color:${ok?'var(--green)':'var(--red)'}">${fmtM(bal)}</span></div>
      ${ok?'':
        `<div style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:10px;font-size:12px;color:var(--red);margin-top:8px;text-align:center">
          ❌ موجودی ناکافی — کمبود: ${fmtM(total-bal)}
        </div>`
      }
      <div style="height:12px"></div>
      ${ok?
        `<button class="btn btn-p btn-full" onclick="confirmOrder()" id="confirm-btn">✅ تایید و پرداخت</button>`:
        `<button class="btn btn-y btn-full" onclick="closeMo();toast('برای شارژ از بات استفاده کنید','info')">💳 شارژ موجودی</button>`
      }
      <div style="height:8px"></div>
      <button class="btn btn-d btn-full" onclick="closeMo()">❌ لغو</button>
    `);
  }
}

function submitLink(){
  const v=(document.getElementById('ord-link')?.value||'').trim();
  if(!v){toast('لینک را وارد کنید','err');return;}
  _state.orderLink=v;_state.orderStep=2;showOrderStep();
}
function submitQty(){
  const v=parseInt(document.getElementById('ord-qty')?.value||'0');
  if(!v||v<_state.svcMin||v>_state.svcMax){
    toast(`تعداد باید بین ${_state.svcMin} و ${_state.svcMax} باشد`,'err');return;
  }
  _state.orderQty=v;_state.orderStep=3;showOrderStep();
}
function submitNote(){
  _state.orderNote=(document.getElementById('ord-note')?.value||'').trim();
  _state.orderStep=4;showOrderStep();
}

async function confirmOrder(){
  const btn=document.getElementById('confirm-btn');
  if(btn){btn.disabled=true;btn.textContent='⏳ در حال ثبت...';}
  try{
    const res=await api('/user/orders/panel',{
      method:'POST',
      body:JSON.stringify({
        service_id:_state.svcId,
        panel_id:_state.panelId,
        link:_state.orderLink,
        quantity:_state.orderQty,
        note:_state.orderNote
      })
    });
    closeMo();
    toast('✅ سفارش با موفقیت ثبت شد');
    // بروزرسانی موجودی
    api('/user/me').then(u=>{_curUser=u;}).catch(()=>{});
    // نمایش جزئیات سفارش
    setTimeout(()=>showOrderResult(res),500);
  }catch(e){
    const msg=e.message||'خطا در ثبت سفارش';
    toast(msg.includes('balance')||msg.includes('موجودی')?'❌ موجودی ناکافی':('❌ '+msg.substring(0,60)),'err');
    if(btn){btn.disabled=false;btn.textContent='✅ تایید و پرداخت';}
  }
}

function showOrderResult(order){
  openMo(`
    <div class="mo-title">🎉 سفارش ثبت شد!<button class="mo-close" onclick="closeMo()">✕</button></div>
    <div style="text-align:center;padding:8px 0 16px">
      <div style="font-size:48px">✅</div>
      <div style="font-size:14px;font-weight:600;margin-top:8px">سفارش #${order.id} ثبت شد</div>
      <div style="font-size:12px;color:var(--text3);margin-top:4px">در صف پردازش قرار گرفت</div>
    </div>
    <div class="od-row"><span class="od-lbl">شناسه سفارش</span><span class="od-val">#${order.id}</span></div>
    <div class="od-row"><span class="od-lbl">مبلغ پرداختی</span><span class="od-val" style="color:var(--red)">-${fmtM4(order.total_price)}</span></div>
    <div class="od-row"><span class="od-lbl">وضعیت</span><span class="od-val">${bdg('pending')}</span></div>
    <div style="height:12px"></div>
    <button class="btn btn-b btn-full" onclick="closeMo();go('orders')">📋 مشاهده سفارشات</button>
  `);
}

// ══════════════════════════════════════════════════════════════════════════════
// ORDERS — سفارشات کاربر
// ══════════════════════════════════════════════════════════════════════════════
let oFlt='all';
async function renderOrders(el){
  el.innerHTML=`
    <div class="hdr"><h1>سفارشات من</h1></div>
    <div class="tabs">
      ${[['all','همه'],['pending','در صف'],['processing','در انجام'],['completed','تکمیل'],['partial','جزئی'],['rejected','رد شده']].map(([v,l])=>
        `<button class="tab ${oFlt===v?'active':''}" onclick="setOFlt('${v}')">${l}</button>`
      ).join('')}
    </div>
    <div id="ord-list">${spin()}</div>`;
  loadOrders();
}
function setOFlt(f){oFlt=f;renderOrders(document.getElementById('pg-orders'));}

async function loadOrders(){
  const el=document.getElementById('ord-list');if(!el)return;
  try{
    const st=oFlt==='all'?'':('&status='+oFlt);
    const d=await api('/user/panel-orders?limit=50'+st);
    if(!d.items.length){el.innerHTML=empty('📭','سفارشی یافت نشد');return;}
    el.innerHTML=d.items.map(o=>`
      <div class="li" onclick="showOrderDetail(${JSON.stringify(o).replace(/"/g,'&quot;')})">
        <div class="li-icon ${o.status==='completed'?'g':o.status==='rejected'?'r':o.status==='partial'?'o':'b'}">${ST_IC[o.status]||'📦'}</div>
        <div class="li-body">
          <div class="li-title">${esc(o.service_name||'سرویس')}</div>
          <div class="li-sub">${bdg(o.status)} · ${(o.quantity||0).toLocaleString('fa')} عدد · ${esc(o.panel_name||'پنل')}</div>
          ${o.status==='partial'&&o.completed_qty?
            `<div class="prog-wrap"><div class="prog-bar" style="width:${Math.min(100,Math.round(o.completed_qty/o.quantity*100))}%"></div></div>`:''
          }
        </div>
        <div class="li-end">
          <div class="li-price">${fmtM(o.total_price)}</div>
          <div class="li-date">${fmtD(o.created_at)}</div>
        </div>
      </div>
    `).join('');
  }catch(e){el.innerHTML=empty('⚠️','خطا در بارگذاری');}
}

function showOrderDetail(o){
  const pct=o.completed_qty&&o.quantity?Math.min(100,Math.round(o.completed_qty/o.quantity*100)):0;
  openMo(`
    <div class="mo-title">${ST_IC[o.status]||'📦'} سفارش #${o.id}<button class="mo-close" onclick="closeMo()">✕</button></div>
    <div class="od-row"><span class="od-lbl">وضعیت</span><span class="od-val">${bdg(o.status)}</span></div>
    <div class="od-row"><span class="od-lbl">خدمت</span><span class="od-val">${esc(o.service_name||'—')}</span></div>
    <div class="od-row"><span class="od-lbl">پنل</span><span class="od-val">${esc(o.panel_name||'—')}</span></div>
    <div class="od-row"><span class="od-lbl">لینک</span><span class="od-val" style="color:var(--accent2);font-size:11px">${esc(o.link||'—')}</span></div>
    <div class="od-row"><span class="od-lbl">تعداد</span><span class="od-val">${(o.quantity||0).toLocaleString('fa')}</span></div>
    ${o.completed_qty?`<div class="od-row"><span class="od-lbl">انجام شده</span><span class="od-val" style="color:var(--green)">${o.completed_qty.toLocaleString('fa')}</span></div>`:''}
    <div class="od-row"><span class="od-lbl">مبلغ کل</span><span class="od-val" style="color:var(--accent2)">${fmtM4(o.total_price)}</span></div>
    ${o.refund_amount>0?`<div class="od-row"><span class="od-lbl">بازگشت وجه</span><span class="od-val" style="color:var(--green)">+${fmtM4(o.refund_amount)}</span></div>`:''}
    ${o.note?`<div class="od-row"><span class="od-lbl">توضیح</span><span class="od-val">${esc(o.note)}</span></div>`:''}
    ${o.admin_note?`<div class="od-row"><span class="od-lbl">یادداشت ادمین</span><span class="od-val" style="color:var(--yellow)">${esc(o.admin_note)}</span></div>`:''}
    <div class="od-row"><span class="od-lbl">تاریخ ثبت</span><span class="od-val">${fmtD(o.created_at)}</span></div>
    ${o.status==='partial'&&pct?`
      <div style="margin-top:10px">
        <div style="font-size:11px;color:var(--text3);margin-bottom:4px">پیشرفت: ${pct}%</div>
        <div class="prog-wrap"><div class="prog-bar" style="width:${pct}%"></div></div>
      </div>`:''
    }
    ${o.refund_amount>0?`<div class="refund-badge">↩️ ${fmtM4(o.refund_amount)} به موجودی شما برگشت داده شد</div>`:''}
  `);
}

// ══════════════════════════════════════════════════════════════════════════════
// WALLET — کیف پول
// ══════════════════════════════════════════════════════════════════════════════
async function renderWallet(el){
  el.innerHTML=`<div class="hdr"><h1>کیف پول</h1></div>${spin()}`;
  try{
    const[u,tx]=await Promise.all([api('/user/me'),api('/user/transactions?limit=50')]);
    _curUser=u;
    const dep=tx.items.filter(t=>['deposit','admin_charge','refund'].includes(t.type)&&t.status==='completed').reduce((s,t)=>s+parseFloat(t.amount||0),0);
    const spd=tx.items.filter(t=>['order_charge','panel_order_charge'].includes(t.type)).reduce((s,t)=>s+Math.abs(parseFloat(t.amount||0)),0);
    const ref=tx.items.filter(t=>t.type==='refund').reduce((s,t)=>s+parseFloat(t.amount||0),0);
    el.innerHTML=`
      <div class="hdr"><h1>کیف پول</h1></div>
      <div class="bal-card">
        <div class="bal-lbl">موجودی فعلی</div>
        <div class="bal-amt">${fmtM(u.balance)}</div>
        <div class="bal-sub">برای شارژ از بات استفاده کنید</div>
      </div>
      <div class="sg">
        <div class="sc"><div class="sc-icon">⬇️</div><div class="sc-val" style="color:var(--green)">${fmtM(dep)}</div><div class="sc-lbl">کل واریز</div></div>
        <div class="sc"><div class="sc-icon">⬆️</div><div class="sc-val" style="color:var(--red)">${fmtM(spd)}</div><div class="sc-lbl">کل خرج</div></div>
        <div class="sc"><div class="sc-icon">↩️</div><div class="sc-val" style="color:var(--blue)">${fmtM(ref)}</div><div class="sc-lbl">بازگشت وجه</div></div>
        <div class="sc"><div class="sc-icon">📊</div><div class="sc-val" style="color:var(--accent2)">${tx.total}</div><div class="sc-lbl">کل تراکنش</div></div>
      </div>
      <div class="st">تراکنش‌های اخیر</div>
      ${tx.items.length?tx.items.map(t=>{
        const isIn=parseFloat(t.amount||0)>0;
        const icons={deposit:'💳',order_charge:'🛒',admin_charge:'🎁',refund:'↩️',panel_order_charge:'🛒'};
        return`<div class="li" onclick="showTxDetail(${JSON.stringify(t).replace(/"/g,'&quot;')})">
          <div class="li-icon ${isIn?'g':'r'}">${icons[t.type]||'💰'}</div>
          <div class="li-body">
            <div class="li-title">${TX_FA[t.type]||t.type}</div>
            <div class="li-sub">${bdg(t.status)}${t.description?' · '+esc(t.description.substring(0,30)):''}</div>
          </div>
          <div class="li-end">
            <div class="li-price" style="color:${isIn?'var(--green)':'var(--red)'}">${isIn?'+':''}${fmtM(t.amount)}</div>
            <div class="li-date">${fmtD(t.created_at)}</div>
          </div>
        </div>`;
      }).join(''):empty('💸','تراکنشی یافت نشد')}
    `;
  }catch(e){el.innerHTML=`<div class="hdr"><h1>کیف پول</h1></div>${empty('⚠️','خطا')}`;}
}

function showTxDetail(t){
  const isIn=parseFloat(t.amount||0)>0;
  openMo(`
    <div class="mo-title">💳 تراکنش #${t.id}<button class="mo-close" onclick="closeMo()">✕</button></div>
    <div class="od-row"><span class="od-lbl">نوع</span><span class="od-val">${TX_FA[t.type]||t.type}</span></div>
    <div class="od-row"><span class="od-lbl">مبلغ</span><span class="od-val" style="color:${isIn?'var(--green)':'var(--red)'};font-size:16px;font-weight:700">${isIn?'+':''}${fmtM(t.amount)}</span></div>
    <div class="od-row"><span class="od-lbl">وضعیت</span><span class="od-val">${bdg(t.status)}</span></div>
    ${t.description?`<div class="od-row"><span class="od-lbl">توضیح</span><span class="od-val">${esc(t.description)}</span></div>`:''}
    ${t.method?`<div class="od-row"><span class="od-lbl">روش</span><span class="od-val">${t.method}</span></div>`:''}
    ${t.tx_hash?`<div class="od-row"><span class="od-lbl">هش</span><span class="od-val" style="font-size:10px">${t.tx_hash}</span></div>`:''}
    <div class="od-row"><span class="od-lbl">تاریخ</span><span class="od-val">${fmtD(t.created_at)}</span></div>
  `);
}

        <div class="sc"><div class="sc-icon">🏦</div><div class="sc-val" style="color:var(--text2)">${fmtM(s.total_balance)}</div><div class="sc-lbl">موجودی کاربران</div></div>

// ══════════════════════════════════════════════════════════════════════════════
// ADMIN USERS
// ══════════════════════════════════════════════════════════════════════════════
let uSrch='',uTimer=null;
async function renderAdmUsers(el){
  el.innerHTML=`
    <div class="hdr"><button class="hdr-back" onclick="goBack()">←</button><h1>کاربران</h1></div>
    <div class="srch"><input placeholder="🔍 نام، یوزرنیم، آیدی..." value="${esc(uSrch)}"
      oninput="uSrch=this.value;clearTimeout(uTimer);uTimer=setTimeout(loadAU,400)"/></div>
    <div id="au-list">${spin()}</div>`;
  loadAU();
}
async function loadAU(){
  const el=document.getElementById('au-list');if(!el)return;
  try{
    const q=uSrch?('&search='+encodeURIComponent(uSrch)):'';
    const d=await api('/admin/users?limit=30'+q);
    if(!d.items.length){el.innerHTML=empty('👤','کاربری یافت نشد');return;}
    el.innerHTML=d.items.map(u=>{
      const nm=[u.first_name,u.last_name].filter(Boolean).join(' ')||u.username||`User${u.telegram_id}`;
      return`<div class="li" onclick="showUserMo(${JSON.stringify(u).replace(/"/g,'&quot;')})">
        <div class="li-icon ${u.is_banned?'r':'p'}">${u.is_banned?'🚫':'👤'}</div>
        <div class="li-body">
          <div class="li-title">${esc(nm)}${u.is_banned?' <span style="color:var(--red);font-size:10px">بن</span>':''}</div>
          <div class="li-sub">@${u.username||'—'} · ${u.telegram_id}</div>
        </div>
        <div class="li-end">
          <div class="li-price">${fmtM(u.balance)}</div>
          <div class="li-date">${fmtD(u.created_at)}</div>
        </div>
      </div>`;
    }).join('');
  }catch(e){el.innerHTML=empty('⚠️','خطا');}
}
function showUserMo(u){
  const nm=[u.first_name,u.last_name].filter(Boolean).join(' ')||u.username||`User${u.telegram_id}`;
  openMo(`
    <div class="mo-title">👤 ${esc(nm)}<button class="mo-close" onclick="closeMo()">✕</button></div>
    <div class="od-row"><span class="od-lbl">آیدی تلگرام</span><span class="od-val">${u.telegram_id}</span></div>
    <div class="od-row"><span class="od-lbl">یوزرنیم</span><span class="od-val">@${u.username||'—'}</span></div>
    <div class="od-row"><span class="od-lbl">موجودی</span><span class="od-val" style="color:var(--green)">${fmtM(u.balance)}</span></div>
    <div class="od-row"><span class="od-lbl">وضعیت</span><span class="od-val">${u.is_banned?'<span style="color:var(--red)">🚫 بن</span>':'<span style="color:var(--green)">✅ فعال</span>'}</span></div>
    <div class="od-row"><span class="od-lbl">تاریخ عضویت</span><span class="od-val">${fmtD(u.created_at)}</span></div>
    <div style="height:12px"></div>
    <div class="ig"><label>شارژ موجودی ($)</label><input type="number" id="ca" placeholder="مثلاً 5.00" step="0.01" min="0.01"/></div>
    <div class="ig"><label>توضیح شارژ (اختیاری)</label><input id="cn" placeholder="دلیل شارژ..."/></div>
    <div class="g2" style="margin-bottom:8px">
      <button class="btn btn-s btn-full" onclick="chargeU(${u.id})">💰 شارژ</button>
      <button class="btn ${u.is_banned?'btn-s':'btn-d'} btn-full" onclick="toggleBan(${u.id},${u.is_banned})">${u.is_banned?'✅ آنبن':'🚫 بن'}</button>
    </div>
  `);
}
async function chargeU(id){
  const amt=parseFloat(document.getElementById('ca')?.value||'0');
  const note=document.getElementById('cn')?.value||'';
  if(!amt||amt<=0){toast('مبلغ معتبر وارد کنید','err');return;}
  try{
    const r=await api('/admin/users/'+id+'/charge',{method:'POST',body:JSON.stringify({amount:amt,note})});
    toast(`✅ شارژ شد — موجودی جدید: ${fmtM(r.new_balance)}`);
    closeMo();loadAU();
  }catch(e){toast('خطا در شارژ','err');}
}
async function toggleBan(id,banned){
  try{
    await api('/admin/users/'+id+'/'+(banned?'unban':'ban'),{method:'POST'});
    toast(banned?'✅ آنبن شد':'🚫 بن شد');closeMo();loadAU();
  }catch(e){toast('خطا','err');}
}

// ══════════════════════════════════════════════════════════════════════════════
// ADMIN ORDERS
// ══════════════════════════════════════════════════════════════════════════════
let aoFlt='pending';
async function renderAdmOrders(el){
  el.innerHTML=`
    <div class="hdr"><button class="hdr-back" onclick="goBack()">←</button><h1>سفارشات پنل</h1></div>
    <div class="tabs">
      ${[['pending','در انتظار'],['processing','در انجام'],['completed','تکمیل'],['partial','جزئی'],['rejected','رد شده'],['all','همه']].map(([v,l])=>
        `<button class="tab ${aoFlt===v?'active':''}" onclick="setAOFlt('${v}')">${l}</button>`
      ).join('')}
    </div>
    <div id="ao-list">${spin()}</div>`;
  loadAO();
}
function setAOFlt(f){aoFlt=f;renderAdmOrders(document.getElementById('pg-adm-orders'));}
async function loadAO(){
  const el=document.getElementById('ao-list');if(!el)return;
  try{
    const st=aoFlt==='all'?'':('&status='+aoFlt);
    const d=await api('/admin/panel-orders?limit=50'+st);
    if(!d.items.length){el.innerHTML=empty('📭','سفارشی یافت نشد');return;}
    el.innerHTML=d.items.map(o=>`
      <div class="li" onclick="showAdmOrder(${JSON.stringify(o).replace(/"/g,'&quot;')})">
        <div class="li-icon ${o.status==='completed'?'g':o.status==='rejected'?'r':o.status==='partial'?'o':'y'}">${ST_IC[o.status]||'🛒'}</div>
        <div class="li-body">
          <div class="li-title">#${o.id} · ${esc((o.service_name||'سرویس').substring(0,30))}</div>
          <div class="li-sub">${bdg(o.status)} · ${esc(o.panel_name||'پنل')} · ${(o.quantity||0).toLocaleString('fa')} عدد</div>
        </div>
        <div class="li-end">
          <div class="li-price">${fmtM(o.total_price)}</div>
          <div class="li-date">${fmtD(o.created_at)}</div>
        </div>
      </div>
    `).join('');
  }catch(e){el.innerHTML=empty('⚠️','خطا');}
}

function showAdmOrder(o){
  const isFinal=['completed','rejected','partial'].includes(o.status);
  openMo(`
    <div class="mo-title">🛒 سفارش #${o.id}<button class="mo-close" onclick="closeMo()">✕</button></div>
    <div class="od-row"><span class="od-lbl">وضعیت</span><span class="od-val">${bdg(o.status)}</span></div>
    <div class="od-row"><span class="od-lbl">خدمت</span><span class="od-val">${esc(o.service_name||'—')}</span></div>
    <div class="od-row"><span class="od-lbl">پنل</span><span class="od-val">${esc(o.panel_name||'—')}</span></div>
    <div class="od-row"><span class="od-lbl">لینک</span><span class="od-val" style="color:var(--accent2);font-size:11px">${esc(o.link||'—')}</span></div>
    <div class="od-row"><span class="od-lbl">تعداد</span><span class="od-val">${(o.quantity||0).toLocaleString('fa')}</span></div>
    <div class="od-row"><span class="od-lbl">مبلغ</span><span class="od-val" style="color:var(--accent2)">${fmtM4(o.total_price)}</span></div>
    ${o.refund_amount>0?`<div class="od-row"><span class="od-lbl">بازگشت وجه</span><span class="od-val" style="color:var(--green)">+${fmtM4(o.refund_amount)}</span></div>`:''}
    ${o.note?`<div class="od-row"><span class="od-lbl">توضیح کاربر</span><span class="od-val">${esc(o.note)}</span></div>`:''}
    <div class="od-row"><span class="od-lbl">تاریخ</span><span class="od-val">${fmtD(o.created_at)}</span></div>
    <div style="height:10px"></div>
    <div class="ig"><label>یادداشت ادمین</label><input id="ao-note" value="${esc(o.admin_note||'')}" placeholder="یادداشت..."/></div>
    ${!isFinal?`
      <div class="g2" style="margin-bottom:8px">
        <button class="btn btn-s" onclick="updAO(${o.id},'completed')">✅ تکمیل</button>
        <button class="btn btn-d" onclick="updAO(${o.id},'rejected')">❌ رد (بازگشت کامل)</button>
      </div>
      <div class="g2" style="margin-bottom:8px">
        <button class="btn btn-b" onclick="updAO(${o.id},'processing')">🔄 در حال انجام</button>
        <button class="btn btn-y" onclick="updAO(${o.id},'pending')">⏳ برگشت به صف</button>
      </div>
      <div class="ig"><label>تکمیل جزئی — تعداد انجام شده</label><input type="number" id="ao-partial" placeholder="مثلاً 500" min="1" max="${o.quantity}"/></div>
      <button class="btn btn-o btn-full" onclick="partialAO(${o.id},${o.quantity})">⚠️ تکمیل جزئی (بازگشت مابقی)</button>
    `:`<div style="text-align:center;color:var(--text3);font-size:12px;padding:8px">این سفارش نهایی شده و قابل تغییر نیست</div>`}
  `);
}

async function updAO(id,status){
  const note=document.getElementById('ao-note')?.value||'';
  try{
    await api('/admin/panel-orders/'+id,{method:'PATCH',body:JSON.stringify({status,admin_note:note})});
    const msgs={completed:'✅ سفارش تکمیل شد',rejected:'❌ سفارش رد شد — وجه برگشت داده شد',
      processing:'🔄 وضعیت به "در حال انجام" تغییر کرد',pending:'⏳ سفارش به صف برگشت'};
    toast(msgs[status]||'✅ بروز شد');closeMo();loadAO();
  }catch(e){toast('خطا','err');}
}

async function partialAO(id,maxQty){
  const qty=parseInt(document.getElementById('ao-partial')?.value||'0');
  if(!qty||qty<=0||qty>=maxQty){toast(`تعداد باید بین 1 و ${maxQty-1} باشد`,'err');return;}
  const note=document.getElementById('ao-note')?.value||'';
  try{
    await api('/admin/panel-orders/'+id,{method:'PATCH',body:JSON.stringify({status:'partial',admin_note:note,completed_qty:qty})});
    toast(`⚠️ تکمیل جزئی — ${qty} عدد انجام شد، مابقی برگشت داده شد`);closeMo();loadAO();
  }catch(e){toast('خطا','err');}
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escJ(s){return encodeURIComponent(String(s||''));}

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init(){
  try{await api('/admin/stats');isAdmin=true;document.getElementById('nb-admin').style.display='flex';}
  catch(e){isAdmin=false;}
  // BackButton
  tg.BackButton.show();
  go('home',true);
}
init();
</script>
