version: "3.9"
services:
  postgres:
    image: postgres:15-alpine
    container_name: tsb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smm
      POSTGRES_PASSWORD: smm123
      POSTGRES_DB: smmbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smm -d smmbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tsb_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  bot:
    build: ./bot
    container_name: tsb_bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./sessions:/app/sessions
      - ./backups:/app/backups
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - PYTHONUNBUFFERED=1

  worker:
    build: ./worker
    container_name: tsb_worker
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./sessions:/app/sessions
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  postgres_data:
  redis_data:
