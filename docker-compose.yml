version: "3.9"
services:
  postgres:
    image: postgres:15-alpine
    container_name: tsb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tsb_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    container_name: tsb_bot
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL:     redis://redis:6379/0
      POSTGRES_HOST: postgres
      REDIS_HOST:    redis
      REDIS_PORT:    "6379"
      BACKUP_DIR:    /app/data/backups
    volumes:
      - sessions_data:/app/sessions
      - app_data:/app/data
      - backup_data:/app/data/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  miniapp_api:
    build:
      context: ./miniapp/api
      dockerfile: Dockerfile
    container_name: tsb_miniapp_api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  miniapp_web:
    build:
      context: ./miniapp
      dockerfile: Dockerfile.nginx
    container_name: tsb_miniapp_web
    restart: unless-stopped
    ports:
      - "9012:80"
    depends_on:
      - miniapp_api

volumes:
  postgres_data:
  redis_data:
  sessions_data:
  app_data:
  backup_data:
